
# --- CONFIGURACIÓN PARA CLOUD RUN ---
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# --- DATASOURCE ---
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=update

# Firebase
firebase.credentials=${FIREBASE_CREDENTIALS:airtellecta-1d1ca-firebase-adminsdk-fbsvc-fd3f5feafb.json}

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept
quarkus.http.cors.access-control-allow-credentials=false